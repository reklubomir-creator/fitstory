name: Generate RADAR mobile icons
on:
  push:
    branches: [main]
    paths:
      - radar-icon.svg
      - .github/workflows/radar-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render mobile and browser icons
        run: |
          python - <<'PY'
          import cairosvg
          for filename, size in [('apple-touch-icon.png',180),('icon-192.png',192),('icon-512.png',512),('favicon-32.png',32)]:
              cairosvg.svg2png(url='radar-icon.svg',write_to=filename,output_width=size,output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png favicon-32.png
          if ! git diff --cached --quiet; then
            git commit -m "v0.4.8 Generate raster icons for iOS Android and browsers"
            git push
          fi
